[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-stock-predictor"
version = "0.1.0"
description = "Local-first multi-model autonomous stock prediction simulator"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "AI Stock Predictor Contributors" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
