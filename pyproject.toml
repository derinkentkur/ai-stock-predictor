[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-stock-predictor"
version = "0.1.0"
description = "Local-first multimodel stock prediction simulator with append-only logs."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "OpenAI Codex" }
]

[tool.setuptools]
packages = ["ai_stock_predictor"]
